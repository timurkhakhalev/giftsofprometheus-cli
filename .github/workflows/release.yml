name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusts this repository, workflow file and environment (Trusted Publishing, OIDC): no token is stored
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm check
      - run: npm pack
      - name: GitHub release
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" giftsofprometheus-cli-*.tgz --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      # Off until the package has a trusted publisher on npmjs.com; the release then ships only on GitHub
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        run: |
          npm install -g npm@^11.5.1
          npm publish --access public
